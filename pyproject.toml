[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookie-scraper"
version = "0.1.1"
description = "Multi-brand sportsbook odds scraper that writes a unified CSV backup feed."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
playwright = [
    "playwright>=1.40.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
bookie-scraper = "bookie_scraper.cli:main"

[tool.setuptools.packages.find]
include = ["bookie_scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
